version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finvault
      POSTGRES_USER: finvault_user
      POSTGRES_PASSWORD: finvault_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finvault_user -d finvault']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ─────────────────────────────────────────────
  mongodb:
    image: mongo:6-jammy
    container_name: finvault_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: finvault_user
      MONGO_INITDB_ROOT_PASSWORD: finvault_pass
      MONGO_INITDB_DATABASE: finvault_audit
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  # ── Zookeeper (Kafka dependency) ────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: finvault_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  # ── Apache Kafka ────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: finvault_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # ── Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: finvault_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://finvault_user:finvault_pass@postgres:5432/finvault
      MONGODB_URI: mongodb://finvault_user:finvault_pass@mongodb:27017/finvault_audit?authSource=admin
      KAFKA_BROKERS: kafka:29092
      JWT_ACCESS_SECRET: your-super-secret-access-key-change-in-prod
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-prod
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: finvault_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  mongodb_data:
